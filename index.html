    <script>
      // Defensive guard for browser extensions that attempt `window.fetch = ...` when window.fetch only has a getter
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.writable && !desc.set) {
            var origFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return origFetch; },
              set: function(fn) { origFetch = fn; }
            });
          }
        } catch (e) {
          // Ignore if environment blocks descriptor redefine
        }
      })();
