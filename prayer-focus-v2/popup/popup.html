<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="brand-icon">🕌</span>
        <div class="brand-text">
          <h1>Prayer Focus</h1>
          <span class="brand-tag">Pray • Focus • Grow</span>
        </div>
      </div>
      <div class="status-indicator" id="reminder-status-badge">
        <span class="dot"></span>
        <span class="status-text" id="status-label">সক্রিয়</span>
      </div>
    </header>

    <!-- Next Prayer Countdown Card -->
    <section class="next-prayer-card">
      <div class="card-top">
        <span class="label">পরবর্তী ওয়াক্ত</span>
        <span class="time-label" id="next-prayer-time">--:--</span>
      </div>
      <h2 class="prayer-name-display" id="next-prayer-name">নামাজ</h2>
      <div class="countdown-wrapper">
        <span class="countdown-label">সময় বাকি:</span>
        <span class="countdown-digits" id="countdown-text">--:--:--</span>
      </div>
    </section>

    <!-- Quick Prayer Timings Grid -->
    <div class="prayer-grid" id="prayer-grid">
      <div class="grid-item" data-key="fajr">
        <span class="p-name">ফজর</span>
        <span class="p-time" id="time-fajr">--:--</span>
      </div>
      <div class="grid-item" data-key="dhuhr">
        <span class="p-name">যোহর</span>
        <span class="p-time" id="time-dhuhr">--:--</span>
      </div>
      <div class="grid-item" data-key="asr">
        <span class="p-name">আসর</span>
        <span class="p-time" id="time-asr">--:--</span>
      </div>
      <div class="grid-item" data-key="maghrib">
        <span class="p-name">মাগরিব</span>
        <span class="p-time" id="time-maghrib">--:--</span>
      </div>
      <div class="grid-item" data-key="isha">
        <span class="p-name">এশা</span>
        <span class="p-time" id="time-isha">--:--</span>
      </div>
    </div>

    <!-- Quick Actions (Does NOT touch New Tab) -->
    <div class="actions-row">
      <button class="btn btn-primary" id="btn-open-dashboard">
        <span class="btn-icon">📊</span> ড্যাশবোর্ড খুলুন
      </button>
      <button class="btn btn-secondary" id="btn-open-settings">
        <span class="btn-icon">⚙️</span> সেটিংস
      </button>
    </div>

    <footer class="popup-footer">
      <span id="location-label">চট্টগ্রাম, বাংলাদেশ (Asia/Dhaka)</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
